name: Trend Monitor Sweep

# Runs the X doom-scroll agent (headed Chromium via a virtual display, since headless was
# proven to get bot-walled by X - see project memory) plus the RSS lanes, then commits
# whatever changed back to the repo. The repo itself is the free persistent "database" -
# no external storage needed, and it survives fine across ephemeral runners since every
# run starts by checking out the latest committed state.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Runs are 10min apart. Without this, if a run overran 10min the next scheduled tick would
# start in parallel - two Chromium sessions logging into the same X account at once (risks
# a flag) and a git push race. With this, a run that's still going when the next tick fires
# just waits/queues until the current one finishes, then starts - never in parallel.
# cancel-in-progress stays false because dropping a half-finished scrape/commit is worse
# than a short wait.
concurrency:
  group: sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Was 12 - too tight: setup (Playwright/Xvfb/Ollama install+pull) alone can take several
    # minutes, then 10 doom-scroll cycles with randomized pauses up to 70s each can run long.
    # Several real runs were hitting this timeout and getting cancelled mid-job, which loses
    # everything uncommitted for that run (commit step is at the very end) - including the
    # debug screenshots added to diagnose the home-lane bug below.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb (virtual display for headed Chromium)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434 >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b

      - name: Restore secrets to disk
        run: |
          echo "${{ secrets.X_STATE_JSON_B64 }}" | base64 -d > x_state.json
          echo "${{ secrets.CONFIG_LOCAL_JSON_B64 }}" | base64 -d > config.local.json

      - name: Run doom-scroll sweep (X)
        run: xvfb-run -a node doom_scroll_agent.js 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true # one lane failing (e.g. X account issue) shouldn't block the RSS lanes below

      - name: Binance Square lane (dedupe, pace, paraphrase, Telegram, post)
        run: node square_cloud.js
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        continue-on-error: true

      - name: Persist Square state immediately (so a later push conflict can never cause a double post)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=square_state.json
          [ -f $f ] || exit 0
          sha=$(gh api repos/${{ github.repository }}/contents/$f --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/${{ github.repository }}/contents/$f -f message="Square state $(date -u +%H:%M)" -f content="$(base64 -w0 $f)" -f branch=main ${sha:+-f sha=$sha} > /dev/null
          git checkout -- $f 2>/dev/null || true
        continue-on-error: true

      - name: Refresh YouTube
        run: node youtube_monitor.js
        continue-on-error: true

      - name: Refresh regulator / exchange / protocol RSS lanes
        run: node refresh_all_rss.js
        continue-on-error: true

      - name: Remove secrets before commit
        run: rm -f x_state.json config.local.json

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_activity_log.json youtube_latest_log.json regulator_latest_log.json exchange_latest_log.json protocol_latest_log.json doom_scroll_debug_home.png doom_scroll_debug_explore.png 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Automated sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The remote can move while this run scrapes (overlapping run, or the dashboard committing).
          # A text rebase of these big JSON arrays conflicts, so on rejection merge by item id instead
          # (merge_data.js: remote wins per id, this run's new items are appended), then re-commit on top.
          FILES="dashboard_activity_log.json youtube_latest_log.json regulator_latest_log.json exchange_latest_log.json protocol_latest_log.json"
          PNGS="doom_scroll_debug_home.png doom_scroll_debug_explore.png"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, merging by id and retrying ($i/5)..."
            # git reset --hard below discards these too (they don't merge-by-id like the JSON
            # lanes) - stash a copy first so this run's own screenshots survive the retry.
            mkdir -p "$RUNNER_TEMP/pngs" && cp $PNGS "$RUNNER_TEMP/pngs/" 2>/dev/null || true
            git fetch -q origin main
            node merge_data.js "$RUNNER_TEMP/merged"
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP"/merged/*.json .
            cp "$RUNNER_TEMP"/pngs/*.png . 2>/dev/null || true
            git add $FILES $PNGS 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "Automated sweep $(date -u +%Y-%m-%dT%H:%M:%SZ) (merged)"
            sleep 2
          done
          echo "::error::git push failed after 5 retries"
          exit 1
